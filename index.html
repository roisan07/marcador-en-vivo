<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcadores en Vivo</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

#marcadores {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}
</style>
</head>

<body>

<div id="marcadores">

    <!-- LA LIGA -->
    <div data-sportscore="tracker" data-sport="football" data-team="real-madrid"></div>
    <div data-sportscore="tracker" data-sport="football" data-team="barcelona"></div>

    <!-- PREMIER LEAGUE -->
    <div data-sportscore="tracker" data-sport="football" data-team="arsenal"></div>
    <div data-sportscore="tracker" data-sport="football" data-team="liverpool"></div>
    <div data-sportscore="tracker" data-sport="football" data-team="chelsea"></div>
    <div data-sportscore="tracker" data-sport="football" data-team="manchester-city"></div>
    <div data-sportscore="tracker" data-sport="football" data-team="manchester-united"></div>
    <div data-sportscore="tracker" data-sport="football" data-team="newcastle-united"></div>
    <div data-sportscore="tracker" data-sport="football" data-team="aston-villa"></div>

</div>

<script src="https://sportscore.com/embed.js" async></script>

</body>
</html>
